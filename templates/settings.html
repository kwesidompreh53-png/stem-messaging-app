<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Settings - STE-M</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Platform Settings</span>
            <a href="{{ url_for('dashboard') }}" class="btn btn-light btn-sm">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-bold">System Preferences</div>
            <div class="card-body">
                <form action="/settings" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Default Sender ID / Name</label>
                        <input type="text" class="form-control" name="default_sender" value="STE-M" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Maximum Campaign Retries</label>
                        <input type="number" class="form-control" name="max_retry" value="3" min="1" max="5" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="emailAlerts" checked>
                        <label class="form-check-label" for="emailAlerts">Enable Email Notifications for Bulk Deliveries</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
