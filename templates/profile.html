{% extends "base.html" %}

{% block title %}Edit Profile - DANSOMAN DISTRICT ENGLISH ASSEMBLY DASHBOARD{% endblock %}

{% block content %}
    <nav class="navbar navbar-dark bg-primary shadow-sm rounded mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">DANSOMAN DISTRICT ENGLISH ASSEMBLY DASHBOARD - Profile</span>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold text-dark">Edit Account Details</div>
            <div class="card-body">
                <form action="/profile" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-dark">Username</label>
                        <input type="text" class="form-control" name="username" value="{{ current_user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-dark">New Password (leave blank to keep current)</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter new password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
