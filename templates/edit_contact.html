{% extends "base.html" %}

{% block title %}Edit Contact - DANSOMAN DISTRICT ENGLISH ASSEMBLY DASHBOARD{% endblock %}

{% block content %}
    <nav class="navbar navbar-dark bg-primary shadow-sm rounded mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">DANSOMAN DISTRICT ENGLISH ASSEMBLY DASHBOARD - Edit Contact</span>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold text-dark">Update Contact Details</div>
            <div class="card-body">
                <form action="{{ url_for('edit_contact', contact_id=contact.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-dark">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ contact.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-dark">Phone Number</label>
                        <input type="text" class="form-control" name="phone_number" value="{{ contact.phone_number }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-dark">Group Name</label>
                        <input type="text" class="form-control" name="group_name" value="{{ contact.group_name }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
