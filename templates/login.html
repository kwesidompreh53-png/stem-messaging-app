{% extends "base.html" %}

{% block title %}Login - DANSOMAN DISTRICT ENGLISH ASSEMBLY DASHBOARD{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card p-4 shadow-lg">
            <div class="text-center mb-3">
                <img src="{{ url_for('static', filename='images/Pentecost.jpg') }}" alt="Logo" class="mb-2 rounded-circle shadow-sm" style="width: 70px; height: 70px; object-fit: contain;">
                <h4 class="fw-bold text-dark fs-5">DANSOMAN DISTRICT ENGLISH ASSEMBLY</h4>
                <p class="text-muted small">Please sign in to continue</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-dark">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-dark">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Login</button>
            </form>
            
            <p class="text-center mt-3 mb-0 text-muted small">
                Don't have an account? <a href="/register" class="text-success fw-bold text-decoration-none">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
